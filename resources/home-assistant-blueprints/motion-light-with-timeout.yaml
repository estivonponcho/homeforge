blueprint:
  name: HomeForge motion light with timeout
  description: Turn a light on when motion is detected and turn it off after the area stays clear.
  domain: automation
  source_url: https://github.com/estivonponcho/homeforge/blob/main/resources/home-assistant-blueprints/motion-light-with-timeout.yaml
  input:
    motion_sensor:
      name: Motion or occupancy sensor
      selector:
        entity:
          domain: binary_sensor
    target_light:
      name: Light
      selector:
        target:
          entity:
            domain: light
    no_motion_wait:
      name: Clear-time delay
      description: Seconds the sensor must remain clear before the light turns off.
      default: 120
      selector:
        number:
          min: 10
          max: 1800
          unit_of_measurement: seconds
          mode: box

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input motion_sensor
    from: "off"
    to: "on"

action:
  - service: light.turn_on
    target: !input target_light
  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_sensor
        from: "on"
        to: "off"
        for:
          seconds: !input no_motion_wait
  - service: light.turn_off
    target: !input target_light
